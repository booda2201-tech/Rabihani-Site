<section id="how" #root class="relative">
  <div data-pin class="relative flex min-h-screen items-center overflow-hidden py-20 lg:py-0">
    <div class="pointer-events-none absolute inset-0 overflow-hidden will-change-transform">
      <div class="absolute right-1/2 top-1/2 h-[40rem] w-[40rem] -translate-y-1/2 translate-x-1/2 rounded-full bg-bid/10 blur-[140px]"></div>
    </div>

    <div class="container-x relative grid items-center gap-8 lg:grid-cols-2 lg:gap-x-12 lg:gap-y-0">
      <div class="lg:self-end">
        <span class="eyebrow">إزاي تكسب</span>
        <h2 class="section-title mt-5">اشرب، اغسل العربية، اشتري شاي… <span class="text-gold-gradient">وزايد.</span></h2>
        <p class="section-lead mt-4">تلات خطوات بس بينك وبين الجايزة.</p>
      </div>

      <div class="flex justify-center [perspective:1400px] lg:col-start-2 lg:row-span-2 lg:row-start-1">
        <div class="h-[378px] lg:h-auto">
          <div class="origin-top scale-[0.7] lg:scale-100">
            <div data-phone class="[transform-style:preserve-3d]">
              <app-phone-frame>
                <div *ngFor="let s of steps" data-screen class="absolute inset-0">
                  <app-phone-screen [screen]="s.screen"></app-phone-screen>
                </div>
              </app-phone-frame>
            </div>
          </div>
        </div>
      </div>

      <ol class="relative space-y-2 pr-6 lg:mt-10 lg:space-y-4 lg:self-start">
        <span class="absolute right-0 top-2 h-[calc(100%-1rem)] w-1 overflow-hidden rounded-full bg-white/10">
          <span data-progress class="block h-full w-full origin-top rounded-full bg-gradient-to-b from-gold-light to-gold"></span>
        </span>

        <li
          *ngFor="let s of steps; let i = index"
          data-step
          (click)="select(i)"
          class="group flex cursor-pointer items-start gap-4 rounded-3xl p-3 transition-colors duration-300 lg:cursor-default lg:p-4 [&.is-active]:bg-white/[0.04]"
        >
          <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-card text-slate-500 ring-1 ring-white/10 transition-colors duration-300 group-[.is-active]:text-gold group-[.is-active]:ring-gold/30 lg:h-14 lg:w-14 lg:text-gold lg:ring-gold/30">
            <app-icon [name]="s.icon" class="h-6 w-6 lg:h-7 lg:w-7"></app-icon>
          </span>
          <div class="min-w-0 pt-0.5">
            <p class="text-xs font-bold text-bid">الخطوة {{ i + 1 }}</p>
            <h3 class="mt-1 text-lg font-bold text-slate-400 transition-colors duration-300 group-[.is-active]:text-white lg:text-xl lg:text-white">{{ s.title }}</h3>
            <p class="mt-1 font-medium leading-relaxed text-slate-400 max-lg:hidden group-[.is-active]:block">{{ s.text }}</p>
          </div>
        </li>
      </ol>
    </div>
  </div>
</section>
