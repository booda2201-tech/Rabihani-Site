<section id="how" #root class="relative">
  <div data-pin class="relative flex min-h-screen items-center overflow-hidden py-24 lg:py-0">
    <div class="pointer-events-none absolute right-1/2 top-1/2 h-[40rem] w-[40rem] -translate-y-1/2 translate-x-1/2 rounded-full bg-bid/10 blur-[140px]"></div>

    <div class="container-x relative grid items-center gap-12 lg:grid-cols-2">
      <div>
        <span class="eyebrow">إزاي تكسب</span>
        <h2 class="section-title mt-5">اشرب، اغسل العربية، اشتري شاي… <span class="text-gold-gradient">وزايد.</span></h2>
        <p class="section-lead mt-4">تلات خطوات بس بينك وبين الجايزة.</p>

        <ol class="relative mt-10 space-y-4 pr-6">
          <span class="absolute right-0 top-2 h-[calc(100%-1rem)] w-1 overflow-hidden rounded-full bg-white/10">
            <span data-progress class="block h-full w-full origin-top rounded-full bg-gradient-to-b from-gold-light to-gold"></span>
          </span>

          <li
            *ngFor="let s of steps; let i = index"
            data-step
            class="group flex items-start gap-4 rounded-3xl p-4 transition-colors duration-300 [&.is-active]:bg-white/[0.04]"
          >
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-card text-gold ring-1 ring-gold/30">
              <app-icon [name]="s.icon" class="h-7 w-7"></app-icon>
            </span>
            <div>
              <p class="text-xs font-bold text-bid">الخطوة {{ i + 1 }}</p>
              <h3 class="mt-1 text-xl font-bold text-white">{{ s.title }}</h3>
              <p class="mt-1 font-medium leading-relaxed text-slate-400">{{ s.text }}</p>
            </div>
          </li>
        </ol>
      </div>

      <div class="flex justify-center [perspective:1400px]">
        <div data-phone class="[transform-style:preserve-3d]">
          <app-phone-frame>
            <div *ngFor="let s of steps" data-screen class="absolute inset-0">
              <app-phone-screen [screen]="s.screen"></app-phone-screen>
            </div>
          </app-phone-frame>
        </div>
      </div>
    </div>
  </div>
</section>
