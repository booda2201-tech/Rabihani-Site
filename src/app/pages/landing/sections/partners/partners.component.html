<section id="partners" #root class="relative overflow-hidden py-28 lg:py-36">
  <div class="container-x">
    <div class="mx-auto max-w-2xl text-center">
      <span class="eyebrow">الشركات</span>
      <h2 class="section-title mt-5">مشوارك العادي <span class="text-gold-gradient">بقى بنقاط.</span></h2>
      <p class="section-lead mt-4">اشتري من الأماكن دي، امسح الكود، والنقاط تنزل في ثانيتها.</p>
    </div>

    <div data-partner-grid class="mt-14 grid grid-cols-2 gap-4 [perspective:1200px] md:grid-cols-3 lg:grid-cols-5">
      <div *ngFor="let p of partners; let last = last" data-partner [class.col-span-2]="last" class="md:col-span-1">
        <button
          type="button"
          (click)="toggle(p)"
          class="group relative h-56 w-full overflow-hidden rounded-[2rem] bg-card p-5 text-right ring-1 ring-white/[0.06] transition duration-500 hover:-translate-y-1 hover:ring-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold"
          [attr.aria-expanded]="open === p"
        >
          <div class="absolute -left-10 -top-10 h-32 w-32 rounded-full opacity-30 blur-2xl transition duration-500 group-hover:opacity-60" [style.background]="p.from"></div>

          <span class="relative grid h-16 w-16 place-items-center rounded-2xl text-2xl font-bold text-white shadow-lg" [style.background]="'linear-gradient(135deg,' + p.from + ',' + p.to + ')'">{{ p.mark }}</span>
          <p class="relative mt-5 text-lg font-bold text-white">{{ p.name }}</p>
          <p class="relative text-sm font-semibold text-slate-400">{{ p.kind }}</p>

          <div
            class="absolute inset-0 flex flex-col justify-end bg-gradient-to-t from-ink via-ink/95 to-ink/70 p-5 transition duration-500 group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:translate-y-0 group-focus-visible:opacity-100"
            [class.translate-y-full]="open !== p"
            [class.opacity-0]="open !== p"
          >
            <span class="mb-3 grid h-10 w-10 place-items-center rounded-xl bg-gold/15 text-gold"><app-icon name="qr" class="h-5 w-5"></app-icon></span>
            <p class="text-base font-bold leading-relaxed text-white">{{ p.tagline }}</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- partner ads from the app banner -->
  <div *ngIf="ads.length" class="mt-20" dir="ltr">
    <p class="container-x mb-6 text-center text-sm font-bold text-slate-400" dir="rtl">نفس البنر اللي بيقابلك في التطبيق</p>
    <div class="relative overflow-x-auto [mask-image:linear-gradient(90deg,transparent,black_10%,black_90%,transparent)] motion-safe:overflow-hidden">
      <div #track class="flex w-max">
        <ng-container *ngFor="let copy of [0, 1]">
          <figure *ngFor="let ad of ads" class="ml-5 h-44 w-80 shrink-0 overflow-hidden rounded-3xl bg-card ring-1 ring-white/10 sm:h-52 sm:w-96" [attr.aria-hidden]="copy === 1">
            <img [src]="ad.imageUrl" [alt]="ad.title" class="h-full w-full object-cover transition duration-700 hover:scale-105" loading="lazy" decoding="async" />
          </figure>
        </ng-container>
      </div>
    </div>
  </div>
</section>
